services:
  - type: web
    name: dataviv-backend
    env: node
    plan: free
    rootDir: .
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MEDIASOUP_ENABLED
        value: "false"
      - key: LOG_LEVEL
        value: info
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        value: https://dataviv-frontend.vercel.app
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: dataviv
      - key: REDIS_URL
        sync: false
